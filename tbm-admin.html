<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>工具箱會議總後台 | 信實集團</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { font-family: 'Noto Sans TC', sans-serif; }
        body { background-color: #f4f7f9; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 🌟 絕對相容的手工分頁列印樣式 */
        @media print {
            @page { margin: 0; size: A4 portrait; }
            body { 
                background-color: white !important; 
                margin: 0 !important; 
                -webkit-print-color-adjust: exact !important; 
                print-color-adjust: exact !important; 
            }
            .no-print { display: none !important; }
            
            #report-section { display: block !important; position: static !important; margin: 0 !important; padding: 0 !important; max-width: none !important; }
            
            /* 每一頁都是一個獨立的容器 */
            .print-page {
                page-break-after: always; /* 強制換頁 */
                padding: 1.5cm !important;
                position: relative;
                box-sizing: border-box;
                min-height: 297mm; /* 模擬 A4 高度 */
            }
            /* 最後一頁不強制換頁 */
            .print-page:last-child { page-break-after: auto; }
            
            /* 清除所有表格的跨頁屬性，因為我們已經手動分頁了 */
            table { page-break-inside: auto !important; }
            tr, td { page-break-inside: auto !important; }
            
            .print-photo { max-width: 100% !important; max-height: 400px !important; object-fit: contain; }
            .print-sign { max-height: 45px !important; object-fit: contain; }
            
            /* 強制隱藏某些行動版瀏覽器加入的頁尾網址 */
            body::after { content: none !important; }
        }
    </style>
</head>
<body class="text-slate-800">

    <div class="bg-[#0f3460] h-64 w-full absolute top-0 left-0 z-0 rounded-b-[40px] no-print"></div>

    <div class="relative z-10 max-w-5xl mx-auto px-4 py-8 no-print" id="dashboard-view">
        
        <div class="flex flex-col items-center mb-8 text-white">
            <div class="bg-white w-16 h-12 rounded-xl flex items-center justify-center mb-4 shadow-md relative overflow-hidden">
                <div class="w-[85%] h-[60%] border-[3px] border-[#0f3460] rounded-[100%] flex items-center justify-center absolute">
                    <span class="text-[#0f3460] font-bold italic text-[10px] tracking-tighter" style="font-family: Arial, sans-serif;">sincere</span>
                </div>
            </div>
            <h1 class="text-2xl font-bold tracking-widest">工具箱會議總後台</h1>
            <p class="text-sm text-indigo-200 mt-1">TBM MANAGEMENT PORTAL</p>
        </div>

        <div class="bg-white rounded-2xl shadow-lg p-6 mb-6">
            <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-3">
                <h2 class="text-lg font-bold text-[#0f3460]"><i class="fa-solid fa-folder-open mr-2"></i>會議紀錄清單</h2>
                <button onclick="fetchRecords()" class="text-sm bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-lg hover:bg-indigo-100 transition-colors font-bold">
                    <i class="fa-solid fa-arrows-rotate mr-1"></i> 重新整理
                </button>
            </div>
            
            <div id="loading-state" class="text-center py-10">
                <i class="fa-solid fa-spinner fa-spin text-4xl text-indigo-300 mb-3"></i>
                <p class="text-slate-500 font-bold">資料載入中，請稍候...</p>
            </div>

            <div class="overflow-x-auto no-scrollbar">
                <table class="w-full text-sm text-left hidden" id="records-table">
                    <thead class="text-xs text-slate-500 uppercase bg-slate-50">
                        <tr>
                            <th class="px-4 py-3 rounded-tl-lg">日期時間</th>
                            <th class="px-4 py-3">會議編號</th>
                            <th class="px-4 py-3">作業名稱</th>
                            <th class="px-4 py-3">作業位置</th>
                            <th class="px-4 py-3 rounded-tr-lg text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="records-tbody" class="divide-y divide-slate-100">
                    </tbody>
                </table>
            </div>
            
            <div id="empty-state" class="hidden text-center py-10 text-slate-400">
                <i class="fa-solid fa-inbox text-4xl mb-3"></i>
                <p>目前尚無任何會議紀錄</p>
            </div>
        </div>
        
        <div class="text-center">
            <a href="index.html" class="text-slate-100 hover:text-white underline text-sm"><i class="fa-solid fa-arrow-left mr-1"></i> 返回前台填寫頁面</a>
        </div>
    </div>

    <!-- 報表預覽區塊 -->
    <div id="report-section" class="hidden max-w-4xl mx-auto px-0 md:px-4 py-8 no-print">
        
        <div class="mb-4 px-4 flex justify-between items-center no-print">
            <button onclick="closeReport()" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-lg font-bold hover:bg-slate-300 transition-colors">
                <i class="fa-solid fa-arrow-left mr-1"></i> 返回清單
            </button>
            <button onclick="window.print()" class="bg-[#0f3460] text-white px-6 py-2 rounded-lg font-bold hover:bg-indigo-900 transition-colors shadow-md">
                <i class="fa-solid fa-print mr-1"></i> 列印 / 下載 PDF
            </button>
        </div>

        <!-- 🌟 手動分頁容器，所有內容都會由 JS 動態塞入這裡 -->
        <div id="report-pages-container" class="bg-white shadow-lg rounded-none md:rounded-xl border border-slate-200 overflow-hidden">
        </div>
    </div>

    <script>
        // ⚠️ 請確保這是您的 API 網址
        const API_URL = "https://script.google.com/macros/s/AKfycbwUObPOhhhql6NLjxVouFSxXNgxYezeOasie4gWellTDu_iH1oQbKP_x1qqRyUeZcF3/exec";
        
        let allRecords = []; 

        document.addEventListener('DOMContentLoaded', fetchRecords);

        async function fetchRecords() {
            document.getElementById('loading-state').classList.remove('hidden');
            document.getElementById('records-table').classList.add('hidden');
            document.getElementById('empty-state').classList.add('hidden');
            
            try {
                const response = await fetch(`${API_URL}?action=getRecords`);
                const result = await response.json();
                
                if(result.status === 'success') {
                    allRecords = result.data;
                    renderTable();
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                alert("資料讀取失敗：" + error);
                document.getElementById('loading-state').classList.add('hidden');
            }
        }

        function renderTable() {
            document.getElementById('loading-state').classList.add('hidden');
            const tbody = document.getElementById('records-tbody');
            tbody.innerHTML = '';

            if(allRecords.length === 0) {
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            }

            allRecords.forEach((record, index) => {
                const dt = new Date(record.datetime);
                const dateStr = `${dt.getFullYear()}/${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getDate()).padStart(2,'0')} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
                
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors";
                tr.innerHTML = `
                    <td class="px-4 py-3 font-medium text-slate-700 whitespace-nowrap">${dateStr}</td>
                    <td class="px-4 py-3 text-slate-500 font-mono text-xs">${record.meetingId}</td>
                    <td class="px-4 py-3 font-bold text-[#0f3460]">${record.taskName}</td>
                    <td class="px-4 py-3 text-slate-600">${record.location}</td>
                    <td class="px-4 py-3 text-center">
                        <button onclick="viewReport(${index})" class="bg-indigo-100 text-indigo-700 hover:bg-indigo-200 px-3 py-1.5 rounded text-xs font-bold transition-colors">
                            <i class="fa-solid fa-file-pdf mr-1"></i>預覽/列印
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            
            document.getElementById('records-table').classList.remove('hidden');
        }

        // 🌟 產生每個頁面共用的 Header 標題 HTML
        function getPageHeader(meetingId) {
            return `
                <div class="text-center pb-4 border-b-2 border-[#0f3460] mb-6 pt-4 px-6 md:px-0">
                    <h2 class="text-2xl font-bold text-[#0f3460] tracking-wider mb-1">信實集團 工具箱安全會議暨危害告知單</h2>
                    <p class="text-sm text-slate-500 font-bold">會議編號：${meetingId}</p>
                </div>
            `;
        }

        // 🌟 核心：手動將內容分頁 (Page 1: 資訊與對策 / Page 2: 簽名與照片)
        function viewReport(index) {
            let payload = { ...allRecords[index] };
            
            if (payload.preventions && typeof payload.preventions === 'string' && payload.preventions.startsWith('data:image')) {
                payload.photo = payload.supervisorSign;
                payload.supervisorSign = payload.preventions;
                payload.preventions = payload.hazards;
                payload.hazards = payload.ppe;
                payload.ppe = payload.briefing || "無紀錄";
                payload.briefing = "無資料 (舊版紀錄無此欄位)";
            }
            
            document.getElementById('dashboard-view').classList.add('hidden');
            const reportSection = document.getElementById('report-section');
            reportSection.classList.remove('hidden');
            reportSection.classList.add('print-container');
            window.scrollTo(0, 0);

            const container = document.getElementById('report-pages-container');
            container.innerHTML = ''; // 清空內容

            // ==========================================
            // 📝 第 1 頁：基本資訊、表格與安全防護對策
            // ==========================================
            let page1Html = `
                <div class="print-page bg-white p-6 md:p-8 border-b-8 border-slate-100 md:border-none">
                    ${getPageHeader(payload.meetingId)}
                    <table class="w-full text-xs border-collapse border border-slate-300 mb-6">
                        <tr>
                            <td class="border border-slate-300 p-2 font-bold bg-slate-100 w-[15%]">作業單位</td>
                            <td class="border border-slate-300 p-2 w-[35%]">${payload.unit || ''}</td>
                            <td class="border border-slate-300 p-2 font-bold bg-slate-100 w-[15%]">日期時間</td>
                            <td class="border border-slate-300 p-2 w-[35%]">${payload.datetime || ''}</td>
                        </tr>
                        <tr>
                            <td class="border border-slate-300 p-2 font-bold bg-slate-100">作業名稱</td>
                            <td class="border border-slate-300 p-2 text-blue-700 font-bold" colspan="3">${payload.taskName || ''}</td>
                        </tr>
                        <tr>
                            <td class="border border-slate-300 p-2 font-bold bg-slate-100">作業位置</td>
                            <td class="border border-slate-300 p-2">${payload.location || ''}</td>
                            <td class="border border-slate-300 p-2 font-bold bg-slate-100">作業內容</td>
                            <td class="border border-slate-300 p-2">${payload.content || ''}</td>
                        </tr>
                        <tr>
                            <td class="border border-slate-300 p-2 font-bold bg-slate-100">機具設備</td>
                            <td class="border border-slate-300 p-2" colspan="3">${payload.tools || ''}</td>
                        </tr>
                        <tr>
                            <td class="border border-slate-300 p-2 font-bold bg-slate-100">防護設備</td>
                            <td class="border border-slate-300 p-2" colspan="3">${payload.ppe || ''}</td>
                        </tr>
                        <tr>
                            <td class="border border-slate-300 p-2 font-bold bg-slate-100">危害因素</td>
                            <td class="border border-slate-300 p-2 text-red-600 font-bold" colspan="3">${payload.hazards || ''}</td>
                        </tr>
                    </table>

                    <h3 class="font-bold text-slate-800 bg-slate-100 px-3 py-1.5 border-l-4 border-[#0f3460] mb-3 text-sm">安全防護對策與宣導</h3>
                    <div class="text-[11px] text-slate-700 whitespace-pre-wrap leading-relaxed px-2 break-all break-words overflow-hidden">${payload.preventions || ''}</div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', page1Html);

            // ==========================================
            // 📝 第 2 頁：簽名區塊與現場照片
            // ==========================================
            let attendeesHtml = '<div class="grid grid-cols-3 gap-4 mt-3">';
            if(payload.attendees && payload.attendees.length > 0) {
                payload.attendees.forEach((p, idx) => {
                    attendeesHtml += `
                        <div class="border border-slate-200 rounded p-1.5 text-center bg-white shadow-sm">
                            <img src="${p.sign}" class="print-sign w-full h-12 object-contain mb-1 border border-slate-100">
                            <div class="text-[9px] text-slate-500 font-bold">簽署人員 ${idx + 1}</div>
                        </div>`;
                });
            } else {
                attendeesHtml += '<div class="text-sm text-slate-500 col-span-3 p-2">無人員簽名紀錄</div>';
            }
            attendeesHtml += '</div>';

            let photoHtml = '';
            if(payload.photo && payload.photo.startsWith('data:image')) {
                photoHtml = `
                <div class="mt-8 border-t-2 border-slate-800 pt-4">
                    <h3 class="font-bold text-slate-800 mb-3 text-sm"><i class="fa-solid fa-camera mr-1"></i> 現場會議照片</h3>
                    <img src="${payload.photo}" class="print-photo w-full rounded border border-slate-200 bg-slate-50 mx-auto shadow-sm">
                </div>`;
            }

            let page2Html = `
                <div class="print-page bg-white p-6 md:p-8">
                    <!-- 🌟 關鍵：第二頁手動再塞一次 Header -->
                    ${getPageHeader(payload.meetingId)}
                    
                    <div class="mb-6">
                        <h3 class="font-bold text-slate-800 mb-2 text-sm">現場作業主管簽名</h3>
                        <div class="border border-slate-200 bg-slate-50 rounded p-2 h-16 flex items-center justify-start w-1/3 shadow-sm">
                            <img src="${payload.supervisorSign}" class="print-sign max-h-full max-w-full">
                        </div>
                    </div>

                    <div>
                        <div class="bg-indigo-50 px-3 py-2 border-l-4 border-indigo-600 mb-2">
                            <h3 class="font-bold text-slate-800 text-sm">參與人員簽署確認清單</h3>
                            <div class="text-[10px] text-indigo-700 font-bold mt-1">作業安全承諾：我已了解並遵守所有安全作業規範與危害告知內容，確保自身與他人安全。</div>
                        </div>
                        ${attendeesHtml}
                    </div>

                    ${photoHtml}
                </div>
            `;
            container.insertAdjacentHTML('beforeend', page2Html);
        }

        function closeReport() {
            document.getElementById('report-section').classList.add('hidden');
            document.getElementById('report-section').classList.remove('print-container');
            document.getElementById('dashboard-view').classList.remove('hidden');
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
