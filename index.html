<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>工具箱安全會議暨危害告知單</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #f4f7f9; }
        canvas { touch-action: none; background-color: #ffffff; }
        .chip-checkbox { display: none; }
        .chip-label {
            display: inline-block; padding: 0.35rem 0.75rem; margin: 0.2rem;
            font-size: 0.75rem; font-weight: 500; border-radius: 9999px;
            cursor: pointer; transition: all 0.2s;
            border: 1px solid #cbd5e1; color: #475569; background-color: #f8fafc;
        }
        .chip-checkbox:checked + .chip-label { background-color: #0f3460; color: white; border-color: #0f3460; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .chip-danger:checked + .chip-label { background-color: #ef4444; border-color: #ef4444; }
        .chip-safe:checked + .chip-label { background-color: #10b981; border-color: #10b981; }
    </style>
</head>
<body class="pb-20 text-slate-800">

    <header class="bg-[#0f3460] text-white py-4 px-4 shadow-md sticky top-0 z-50 flex items-center justify-between">
        <div class="flex items-center">
            <div class="bg-yellow-500 text-[#0f3460] w-8 h-8 rounded flex items-center justify-center mr-3 shrink-0">
                <i class="fa-solid fa-person-digging text-lg"></i>
            </div>
            <h1 class="text-lg font-bold tracking-widest leading-tight">工具箱安全會議紀錄<br><span class="text-[10px] text-yellow-300 font-medium">TBM & Hazard Notification</span></h1>
        </div>
    </header>

    <main class="max-w-3xl mx-auto mt-4 px-4 space-y-4">
        
        <!-- 🌟 區塊 1：勤前宣導確認事項 (改為純文字顯示) -->
        <div class="bg-white rounded-xl shadow-sm border border-blue-200 overflow-hidden mb-4">
            <div class="bg-blue-50 px-4 py-2 border-b border-blue-100 font-bold text-blue-700 flex items-center">
                <i class="fa-solid fa-bullhorn mr-2"></i>勤前宣導確認事項
            </div>
            <div class="p-4 space-y-3 text-sm text-slate-600 bg-slate-50/50">
                <div class="flex items-start"><i class="fa-solid fa-circle-check text-blue-500 mt-1 mr-2 shrink-0"></i><div><span class="font-bold text-slate-700">人員狀況：</span>作業人員無身體不適、暈眩、疲勞或其他影響安全作業之情形；不得酒後作業。</div></div>
                <div class="flex items-start"><i class="fa-solid fa-circle-check text-blue-500 mt-1 mr-2 shrink-0"></i><div><span class="font-bold text-slate-700">操作資格：</span>高空工作車、吊籠等設備操作人員具備相應資格，並於作業前完成設備檢點。</div></div>
                <div class="flex items-start"><i class="fa-solid fa-circle-check text-blue-500 mt-1 mr-2 shrink-0"></i><div><span class="font-bold text-slate-700">作業環境：</span>作業前確認地面、動線、照明、天候等狀況；異常時應先改善或停止作業。</div></div>
                <div class="flex items-start"><i class="fa-solid fa-circle-check text-blue-500 mt-1 mr-2 shrink-0"></i><div><span class="font-bold text-slate-700">區域管制：</span>依需求設置交通錐、連桿、警示帶，避免無關人員及車輛進入作業範圍。</div></div>
                <div class="flex items-start"><i class="fa-solid fa-circle-check text-blue-500 mt-1 mr-2 shrink-0"></i><div><span class="font-bold text-slate-700">高風險通報：</span>高風險作業前應完成通報，並依規定至園區施工平台完成進場及退場打卡。</div></div>
            </div>
            <!-- 隱藏的輸入框，用於送出資料時將這些宣導內容存入資料庫 -->
            <input type="hidden" id="t-briefing" value="已確認人員狀況、操作資格、作業環境、區域管制與高風險通報等事項。">
        </div>

        <!-- 區塊 2：基本資訊 -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="bg-slate-50 px-4 py-2 border-b border-slate-100 font-bold text-[#0f3460]"><i class="fa-solid fa-list-check mr-2"></i>作業基本資訊</div>
            <div class="p-4 space-y-4 text-sm">
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="block text-slate-500 mb-1 font-bold">作業單位</label><input type="text" id="t-unit" value="信實公司" class="w-full border border-slate-300 rounded p-2 focus:ring-1 focus:ring-[#0f3460]"></div>
                    <div><label class="block text-slate-500 mb-1 font-bold">日期時間</label><input type="datetime-local" id="t-datetime" class="w-full border border-slate-300 rounded p-2 text-xs"></div>
                </div>
                <div><label class="block text-slate-500 mb-1 font-bold">作業名稱</label><input type="text" id="t-taskName" placeholder="請輸入案件名稱或編號" class="w-full border border-slate-300 rounded p-2"></div>
                
                <div>
                    <label class="block text-slate-500 mb-1 font-bold">作業位置</label>
                    <div id="cg-location" class="mb-2">
                        <input type="radio" id="loc-1" name="location" value="第一航廈" class="chip-checkbox"><label for="loc-1" class="chip-label">第一航廈</label>
                        <input type="radio" id="loc-2" name="location" value="第二航廈" class="chip-checkbox"><label for="loc-2" class="chip-label">第二航廈</label>
                        <input type="radio" id="loc-3" name="location" value="第三航廈" class="chip-checkbox"><label for="loc-3" class="chip-label">第三航廈</label>
                        <input type="radio" id="loc-4" name="location" value="其他" class="chip-checkbox"><label for="loc-4" class="chip-label">其他區域</label>
                    </div>
                    <input type="text" id="t-location-detail" placeholder="請輸入詳細區域 (如: 管制南、出境大廳)" class="w-full border border-slate-300 rounded p-2 text-xs">
                </div>

                <div>
                    <label class="block text-slate-500 mb-1 font-bold">作業內容 (可複選)</label>
                    <div id="cg-content" class="mb-2">
                        <input type="checkbox" id="cnt-1" value="洗地打蠟作業" class="chip-checkbox"><label for="cnt-1" class="chip-label">洗地打蠟作業</label>
                        <input type="checkbox" id="cnt-2" value="高空作業" class="chip-checkbox"><label for="cnt-2" class="chip-label">高空作業</label>
                        <input type="checkbox" id="cnt-3" value="道路作業" class="chip-checkbox"><label for="cnt-3" class="chip-label">道路作業</label>
                        <input type="checkbox" id="cnt-4" value="一般清潔、除塵、保養作業" class="chip-checkbox"><label for="cnt-4" class="chip-label">一般清潔/除塵/保養</label>
                    </div>
                    <input type="text" id="t-content-other" placeholder="其他作業內容" class="w-full border border-slate-300 rounded p-2 text-xs">
                </div>

                <div>
                    <label class="block text-slate-500 mb-1 font-bold">使用機具設備 (可複選)</label>
                    <div id="cg-tools" class="mb-2">
                        <input type="checkbox" id="tl-1" value="駕駛式洗地車" class="chip-checkbox"><label for="tl-1" class="chip-label">駕駛式洗地車</label>
                        <input type="checkbox" id="tl-2" value="合梯" class="chip-checkbox"><label for="tl-2" class="chip-label">合梯</label>
                        <input type="checkbox" id="tl-3" value="高空工作車-直臂式" class="chip-checkbox"><label for="tl-3" class="chip-label">直臂高空車</label>
                        <input type="checkbox" id="tl-4" value="高空工作車-剪刀式" class="chip-checkbox"><label for="tl-4" class="chip-label">剪刀高空車</label>
                        <input type="checkbox" id="tl-5" value="打蠟機" class="chip-checkbox"><label for="tl-5" class="chip-label">打蠟/晶化機</label>
                        <input type="checkbox" id="tl-6" value="高壓沖洗機" class="chip-checkbox"><label for="tl-6" class="chip-label">高壓沖洗機</label>
                        <input type="checkbox" id="tl-7" value="貨車" class="chip-checkbox"><label for="tl-7" class="chip-label">貨車</label>
                        <input type="checkbox" id="tl-8" value="一般手工具" class="chip-checkbox"><label for="tl-8" class="chip-label">一般手工具</label>
                    </div>
                    <input type="text" id="t-tools-other" placeholder="其他工具補充" class="w-full border border-slate-300 rounded p-2 text-xs">
                </div>
            </div>
        </div>

        <!-- 區塊 3：危害告知 (動態讀取 Excel) -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="bg-red-50 px-4 py-2 border-b border-red-100 font-bold text-red-700 flex justify-between items-center">
                <div><i class="fa-solid fa-triangle-exclamation mr-2"></i>危害告知與對策</div>
                <span id="db-status" class="text-[10px] text-red-400 font-normal"><i class="fa-solid fa-arrows-rotate fa-spin"></i> 同步資料庫中</span>
            </div>
            <div class="p-4 space-y-4 text-sm">
                
                <div>
                    <label class="block text-slate-500 mb-1 font-bold">準備防護設備 (可複選)</label>
                    <div id="cg-ppe" class="mb-2">
                        <input type="checkbox" id="ppe-1" value="反光背心" class="chip-checkbox chip-safe"><label for="ppe-1" class="chip-label">反光背心</label>
                        <input type="checkbox" id="ppe-2" value="安全帽" class="chip-checkbox chip-safe"><label for="ppe-2" class="chip-label">安全帽</label>
                        <input type="checkbox" id="ppe-3" value="背負式安全帶" class="chip-checkbox chip-safe"><label for="ppe-3" class="chip-label">背負式安全帶</label>
                        <input type="checkbox" id="ppe-4" value="三角錐/警示帶" class="chip-checkbox chip-safe"><label for="ppe-4" class="chip-label">三角錐/警示帶</label>
                        <input type="checkbox" id="ppe-5" value="手部防護具" class="chip-checkbox chip-safe"><label for="ppe-5" class="chip-label">手套</label>
                        <input type="checkbox" id="ppe-6" value="眼部防護具" class="chip-checkbox chip-safe"><label for="ppe-6" class="chip-label">護目鏡</label>
                        <input type="checkbox" id="ppe-7" value="臉部防護具" class="chip-checkbox chip-safe"><label for="ppe-7" class="chip-label">臉部防護具</label>
                        <input type="checkbox" id="ppe-8" value="口罩/呼吸防護具" class="chip-checkbox chip-safe"><label for="ppe-8" class="chip-label">口罩/呼吸防護具</label>
                        <input type="checkbox" id="ppe-9" value="電動旗手" class="chip-checkbox chip-safe"><label for="ppe-9" class="chip-label">電動旗手</label>
                        <input type="checkbox" id="ppe-10" value="滅火器" class="chip-checkbox chip-safe"><label for="ppe-10" class="chip-label">滅火器</label>
                    </div>
                </div>

                <div>
                    <label class="block text-slate-500 mb-1 font-bold">可能危害因素 (勾選後自動帶入 Excel 對策)</label>
                    <div id="cg-hazards" class="mb-2">
                        <input type="checkbox" id="hz-1" value="滑倒/跌倒" class="chip-checkbox chip-danger" onchange="generatePreventions()"><label for="hz-1" class="chip-label">滑倒/跌倒</label>
                        <input type="checkbox" id="hz-2" value="墜落/滾落" class="chip-checkbox chip-danger" onchange="generatePreventions()"><label for="hz-2" class="chip-label">墜落/滾落</label>
                        <input type="checkbox" id="hz-3" value="缺氧/中毒" class="chip-checkbox chip-danger" onchange="generatePreventions()"><label for="hz-3" class="chip-label">缺氧/中毒</label>
                        <input type="checkbox" id="hz-4" value="物體飛落/壓傷" class="chip-checkbox chip-danger" onchange="generatePreventions()"><label for="hz-4" class="chip-label">物體飛落/壓傷</label>
                        <input type="checkbox" id="hz-5" value="倒塌/崩塌" class="chip-checkbox chip-danger" onchange="generatePreventions()"><label for="hz-5" class="chip-label">倒塌/崩塌</label>
                        <input type="checkbox" id="hz-6" value="感電" class="chip-checkbox chip-danger" onchange="generatePreventions()"><label for="hz-6" class="chip-label">感電</label>
                        <input type="checkbox" id="hz-7" value="刺、切、割傷" class="chip-checkbox chip-danger" onchange="generatePreventions()"><label for="hz-7" class="chip-label">刺、切、割傷</label>
                        <input type="checkbox" id="hz-8" value="被夾/被捲" class="chip-checkbox chip-danger" onchange="generatePreventions()"><label for="hz-8" class="chip-label">被夾/被捲</label>
                        <input type="checkbox" id="hz-9" value="電弧/灼傷" class="chip-checkbox chip-danger" onchange="generatePreventions()"><label for="hz-9" class="chip-label">電弧/灼傷</label>
                        <input type="checkbox" id="hz-10" value="有害物接觸" class="chip-checkbox chip-danger" onchange="generatePreventions()"><label for="hz-10" class="chip-label">有害物接觸</label>
                        <input type="checkbox" id="hz-11" value="火災/爆炸" class="chip-checkbox chip-danger" onchange="generatePreventions()"><label for="hz-11" class="chip-label">火災/爆炸</label>
                        <input type="checkbox" id="hz-12" value="碰撞/被撞" class="chip-checkbox chip-danger" onchange="generatePreventions()"><label for="hz-12" class="chip-label">碰撞/被撞</label>
                        <input type="checkbox" id="hz-13" value="人因性(不當動作)" class="chip-checkbox chip-danger" onchange="generatePreventions()"><label for="hz-13" class="chip-label">人因性(不當動作)</label>
                        <input type="checkbox" id="hz-14" value="其他" class="chip-checkbox chip-danger" onchange="generatePreventions()"><label for="hz-14" class="chip-label">其他</label>
                    </div>
                </div>

                <div>
                    <label class="block text-slate-500 mb-1 font-bold">危害防止對策</label>
                    <textarea id="t-preventions" rows="8" class="w-full border border-slate-300 rounded p-3 text-xs leading-relaxed bg-yellow-50 text-slate-700" placeholder="等待勾選自動帶入..."></textarea>
                </div>
            </div>
        </div>

        <!-- 區塊 4：主管簽名 -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="bg-yellow-50 px-4 py-2 border-b border-yellow-100 font-bold text-yellow-800"><i class="fa-solid fa-pen-clip mr-2"></i>現場作業主管簽名</div>
            <div class="p-4">
                <canvas id="canvas-supervisor" class="w-full h-32 border-2 border-dashed border-slate-300 rounded-lg cursor-crosshair"></canvas>
                <div class="mt-2 text-right">
                    <button type="button" onclick="clearCanvas('canvas-supervisor')" class="text-xs bg-slate-200 text-slate-600 px-3 py-1.5 rounded font-bold hover:bg-slate-300">清除重簽</button>
                </div>
            </div>
        </div>

        <!-- 區塊 5：參與人員簽名 -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="bg-indigo-50 px-4 py-2 border-b border-indigo-100 font-bold text-indigo-800 flex justify-between items-center">
                <span><i class="fa-solid fa-users mr-2"></i>參與人員簽到</span>
                <button type="button" onclick="addAttendee()" class="bg-indigo-600 text-white text-[10px] px-2 py-1 rounded shadow-sm hover:bg-indigo-700"><i class="fa-solid fa-plus mr-1"></i>新增人員</button>
            </div>
            <div id="attendees-container" class="p-4 space-y-4"></div>
        </div>

        <!-- 提交按鈕 -->
        <button id="submit-btn" type="button" onclick="submitData()" class="w-full bg-[#0f3460] text-white text-lg font-bold py-4 rounded-xl shadow-lg hover:bg-indigo-900 transition-colors mt-6 flex items-center justify-center">
            <i class="fa-solid fa-paper-plane mr-2"></i> 送出安全會議紀錄
        </button>

    </main>

    <script>
        // ⚠️ 請確認這是您剛剛發布的新版 API 網址
        const API_URL = "https://script.google.com/macros/s/AKfycbwUObPOhhhql6NLjxVouFSxXNgxYezeOasie4gWellTDu_iH1oQbKP_x1qqRyUeZcF3/exec";
        
        let attendeeCount = 0;
        let globalPreventionRules = {}; // 用來存放從 Excel 抓下來的對策字典

        // 🌟 輔助函數：將字串去除所有空格與標點符號，方便精準比對
        function cleanString(str) {
            return String(str).replace(/[\s、/／\(\)（）]/g, '').toLowerCase();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('t-datetime').value = now.toISOString().slice(0,16);
            
            initSignaturePad('canvas-supervisor');
            addAttendee(); 
            
            // 載入時去抓 Excel 對策
            fetchPreventionRules();
        });

        // 透過 API 抓取 Excel 裡的對策清單
        async function fetchPreventionRules() {
            try {
                const response = await fetch(API_URL);
                const result = await response.json();
                if(result.status === 'success') {
                    // 將 Excel 的資料存入字典，並使用「去除標點符號的乾淨字串」當作 Key
                    let rawData = result.data;
                    for (let key in rawData) {
                        globalPreventionRules[cleanString(key)] = rawData[key];
                    }
                    document.getElementById('db-status').innerHTML = '<i class="fa-solid fa-circle-check text-green-500"></i> 危害對策庫已同步';
                }
            } catch (error) {
                document.getElementById('db-status').innerHTML = '<i class="fa-solid fa-triangle-exclamation text-orange-500"></i> 同步失敗, 採預設模式';
            }
        }

        // 🌟 核心升級：根據勾選的危害因素，用「乾淨字串」去比對 Excel 資料庫帶入對策
        function generatePreventions() {
            const hazards = getCheckedValues('cg-hazards');
            let resultText = "【通用規範】現場主管已向作業人員說明本次作業內容、危害因素、安全作業方法及緊急應變方式。\n";
            
            hazards.forEach(hz => {
                let cleanHz = cleanString(hz);
                // 用處理過的字串去比對，這樣 "滑倒/跌倒" 就能完美對上 Excel 裡的 "滑倒跌倒" 或 "滑倒/跌倒"
                if (globalPreventionRules[cleanHz]) {
                    resultText += `\n【${hz}】\n${globalPreventionRules[cleanHz]}\n`;
                }
            });
            document.getElementById('t-preventions').value = resultText;
        }

        function getCheckedValues(containerId) {
            const checkboxes = document.querySelectorAll(`#${containerId} input[type="checkbox"]:checked`);
            return Array.from(checkboxes).map(cb => cb.value);
        }

        function getRadioValue(name) {
            const radio = document.querySelector(`input[name="${name}"]:checked`);
            return radio ? radio.value : "";
        }

        function initSignaturePad(canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            let isDrawing = false;
            function resizeCanvas() {
                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width; canvas.height = rect.height;
                ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.strokeStyle = '#0f3460';
            }
            window.addEventListener('resize', resizeCanvas); resizeCanvas();
            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            }
            const start = (e) => { e.preventDefault(); isDrawing = true; const pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); };
            const draw = (e) => { if (!isDrawing) return; e.preventDefault(); const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); };
            const stop = () => { isDrawing = false; };
            canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stop); canvas.addEventListener('mouseout', stop);
            canvas.addEventListener('touchstart', start, {passive: false}); canvas.addEventListener('touchmove', draw, {passive: false});
            canvas.addEventListener('touchend', stop);
        }

        function clearCanvas(canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function isCanvasEmpty(canvasId) {
            const canvas = document.getElementById(canvasId);
            const blank = document.createElement('canvas');
            blank.width = canvas.width; blank.height = canvas.height;
            return canvas.toDataURL() === blank.toDataURL();
        }

        function addAttendee() {
            attendeeCount++;
            const id = `attendee-${attendeeCount}`;
            const html = `
                <div id="${id}" class="bg-slate-50 border border-slate-200 rounded-lg p-3 relative">
                    <button type="button" onclick="document.getElementById('${id}').remove()" class="absolute top-2 right-2 text-red-400 hover:text-red-600"><i class="fa-solid fa-circle-xmark text-lg"></i></button>
                    <div class="mb-2"><label class="block text-xs text-slate-500 mb-1 font-bold">參與人員姓名</label><input type="text" class="attendee-name w-full border border-slate-300 rounded p-2 text-sm focus:ring-1 focus:ring-indigo-500" placeholder="請輸入姓名"></div>
                    <div>
                        <label class="block text-xs text-slate-500 mb-1 font-bold">人員簽名</label>
                        <canvas id="canvas-${id}" class="attendee-canvas w-full h-24 border border-dashed border-slate-300 rounded bg-white cursor-crosshair"></canvas>
                        <div class="mt-1 text-right"><button type="button" onclick="clearCanvas('canvas-${id}')" class="text-[10px] text-slate-500 hover:text-slate-800 underline">清除重簽</button></div>
                    </div>
                </div>`;
            document.getElementById('attendees-container').insertAdjacentHTML('beforeend', html);
            initSignaturePad(`canvas-${id}`);
        }

        async function submitData() {
            const btn = document.getElementById('submit-btn');
            const taskName = document.getElementById('t-taskName').value;
            
            if(!taskName) return alert("請輸入作業名稱！");
            if(isCanvasEmpty('canvas-supervisor')) return alert("主管尚未簽名！");

            let locMain = getRadioValue('location');
            let locDetail = document.getElementById('t-location-detail').value;
            let fullLocation = locMain ? (locDetail ? `${locMain} - ${locDetail}` : locMain) : locDetail;

            let contentArr = getCheckedValues('cg-content');
            if(document.getElementById('t-content-other').value) contentArr.push(document.getElementById('t-content-other').value);
            
            let toolsArr = getCheckedValues('cg-tools');
            if(document.getElementById('t-tools-other').value) toolsArr.push(document.getElementById('t-tools-other').value);
            
            let ppeArr = getCheckedValues('cg-ppe');
            let hazardsArr = getCheckedValues('cg-hazards');
            
            // 抓取隱藏的勤前宣導字串
            let briefingText = document.getElementById('t-briefing').value;

            const meetingId = "TBM-" + new Date().toISOString().slice(0,10).replace(/-/g,"") + "-" + Math.floor(Math.random()*10000);
            
            let payload = {
                meetingId: meetingId,
                unit: document.getElementById('t-unit').value,
                datetime: document.getElementById('t-datetime').value.replace('T', ' '),
                taskName: taskName,
                location: fullLocation,
                content: contentArr.join('、'),
                tools: toolsArr.join('、'),
                briefing: briefingText, 
                ppe: ppeArr.join('、'),
                hazards: hazardsArr.join('、'),
                preventions: document.getElementById('t-preventions').value,
                supervisorSign: document.getElementById('canvas-supervisor').toDataURL('image/png'),
                attendees: []
            };

            const attendeeDivs = document.querySelectorAll('[id^="attendee-"]');
            for(let div of attendeeDivs) {
                const name = div.querySelector('.attendee-name').value;
                const canvas = div.querySelector('.attendee-canvas');
                if(name && !isCanvasEmpty(canvas.id)) {
                    payload.attendees.push({
                        name: name,
                        sign: canvas.toDataURL('image/png'),
                        timestamp: new Date().toLocaleString('zh-TW')
                    });
                }
            }

            if(payload.attendees.length === 0) {
                if(!confirm("您沒有新增任何參與人員的有效簽名，確定要送出嗎？")) return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> 資料傳送中...';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                
                const result = await response.json();
                if(result.status === 'success') {
                    alert("✅ 會議紀錄與簽名已成功送出！");
                    window.location.reload(); 
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                alert("❌ 送出失敗，請檢查網路連線或 API 網址設定。\n錯誤訊息：" + error);
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i> 送出安全會議紀錄';
            }
        }
    </script>
</body>
</html>
